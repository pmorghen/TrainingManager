<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomy Master - Home</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body class="main-menu-bg">
    <header style="position: relative; justify-content: center;">
        <h1>Anatomy Master</h1>
        <div class="nav-links" style="position: absolute; right: 2rem; top: 50%; transform: translateY(-50%);">
            <a href="setup_new.html" class="icon-btn" style="opacity: 0.7;" title="Setup">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </a>
        </div>
    </header>

    <main class="container">
        <div class="menu-grid" style="margin-top: 1rem;">
            <a href="#" id="link-all" class="btn btn-glass btn-menu" onclick="startTraining('all')">
                Alle Fragen trainieren
                <div id="count-all" style="font-size: 0.9rem; opacity: 0.6; margin-top: 0.5rem; text-transform: none; letter-spacing: normal;">Lade...</div>
            </a>
            <a href="#" id="link-hard" class="btn btn-glass btn-menu" onclick="startTraining('hard')">
                Schwierige Fragen trainieren
                <div id="count-hard" style="font-size: 0.9rem; opacity: 0.6; margin-top: 0.5rem; text-transform: none; letter-spacing: normal;">Lade...</div>
            </a>
            <a href="#" id="link-easy" class="btn btn-glass btn-menu" onclick="startTraining('easy')">
                Einfache Fragen trainieren
                <div id="count-easy" style="font-size: 0.9rem; opacity: 0.6; margin-top: 0.5rem; text-transform: none; letter-spacing: normal;">Lade...</div>
            </a>
            <a href="#" id="link-unknown" class="btn btn-glass btn-menu" onclick="startTraining('unknown')">
                Nicht beantwortete Fragen trainieren
                <div id="count-unknown" style="font-size: 0.9rem; opacity: 0.6; margin-top: 0.5rem; text-transform: none; letter-spacing: normal;">Lade...</div>
            </a>

            <!-- Category Filter Button -->
            <a href="select-categories.html?from=index" class="btn btn-glass btn-menu" style="border-color: var(--accent-color); background: rgba(100, 255, 218, 0.05);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="selected-categories-text" style="font-weight: 600; text-transform: none; letter-spacing: normal; color: var(--accent-color);">Lade Kategorien...</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-left: 0.5rem;">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </div>
            </a>
        </div>
    </main>

    <script src="db.js"></script>
    <script>
        let selectedCategoryIds = JSON.parse(localStorage.getItem('selectedCategories') || '[]');

        async function loadUI() {
            try {
                await db.open();
                await updateCounts();
            } catch (err) {
                console.error(err);
            }
        }

        async function updateCounts() {
            let questions = await db.questions.toArray();
            let categories = await db.categories.toArray();
            
            const textEl = document.getElementById('selected-categories-text');
            if (selectedCategoryIds.length === 0) {
                textEl.innerText = "Alle Kategorien";
            } else {
                const chosenNames = categories
                    .filter(c => selectedCategoryIds.includes(c.id))
                    .map(c => c.name);
                textEl.innerText = chosenNames.length > 0 ? chosenNames.join(', ') : "Keine Kategorien";
            }
            
            if (selectedCategoryIds.length > 0) {
                questions = questions.filter(q => 
                    q.categoryIds && q.categoryIds.some(id => selectedCategoryIds.includes(id))
                );
            }

            const all = questions.length;
            const hard = questions.filter(q => q.status === 'hard').length;
            const easy = questions.filter(q => q.status === 'easy').length;
            const unknown = questions.filter(q => q.status === 'unknown').length;
            
            document.getElementById('count-all').innerText = `${all} Fragen`;
            document.getElementById('count-hard').innerText = `${hard} Fragen`;
            document.getElementById('count-easy').innerText = `${easy} Fragen`;
            document.getElementById('count-unknown').innerText = `${unknown} Fragen`;
        }

        function startTraining(mode) {
            let url = `training.html?mode=${mode}`;
            if (selectedCategoryIds.length > 0) {
                url = `training.html?mode=category&catIds=${selectedCategoryIds.join(',')}&submode=${mode}`;
            }
            window.location.href = url;
        }

        window.onload = loadUI;
    </script>
</body>
</html>
