<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomy Master - Fragen</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
    <header style="justify-content: center;">
        <a href="setup_new.html" class="icon-btn" style="position: absolute; left: 2rem; padding: 0.5rem; opacity: 0.7;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
        </a>
        <h1>Fragenkatalog</h1>
        <div style="position: absolute; right: 2rem; display: flex; gap: 0.5rem; align-items: center;">
            <a href="edit-question.html" class="icon-btn" title="Neue Frage" style="font-size: 1.5rem; color: var(--accent-color); padding: 0.5rem; text-decoration: none;">➕</a>
        </div>
    </header>

    <main class="container">
        <div class="card">


            <!-- Category Filter Button -->
            <a href="select-categories.html?from=questions" class="btn btn-glass btn-menu" style="border-color: var(--accent-color); background: rgba(100, 255, 218, 0.05); margin-bottom: 2rem;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="selected-categories-text" style="font-weight: 600; text-transform: none; letter-spacing: normal; color: var(--accent-color);">Lade Kategorien...</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-left: 0.5rem;">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </div>
            </a>

            <div id="questionList" class="item-list">
                <!-- Loaded via JS -->
            </div>
        </div>
    </main>

    <script src="db.js"></script>
    <script>
        let selectedCategoryIds = JSON.parse(localStorage.getItem('selectedCategories') || '[]');

        async function initCatalog() {
            await loadCategoryFilterUI();
            await loadQuestions();
        }

        async function loadCategoryFilterUI() {
            const categories = await db.categories.toArray();
            const textEl = document.getElementById('selected-categories-text');
            if (selectedCategoryIds.length === 0) {
                textEl.innerText = "Alle Kategorien";
            } else {
                const chosenNames = categories
                    .filter(c => selectedCategoryIds.includes(c.id))
                    .map(c => c.name);
                textEl.innerText = chosenNames.length > 0 ? chosenNames.join(', ') : "Keine Kategorien";
            }
        }

        async function loadQuestions() {
            let questions = await db.questions.toArray();
            const categories = await db.categories.toArray();
            const catMap = Object.fromEntries(categories.map(c => [c.id, c.name]));
            
            if (selectedCategoryIds.length > 0) {
                questions = questions.filter(q => 
                    q.categoryIds && q.categoryIds.some(id => selectedCategoryIds.includes(id))
                );
            }
            
            const list = document.getElementById('questionList');
            list.innerHTML = '';
            
            if (questions.length === 0) {
                list.innerHTML = '<p class="text-center" style="opacity:0.5; padding: 2rem;">Keine Fragen in den ausgewählten Kategorien gefunden.</p>';
                return;
            }

            questions.forEach(q => {
                const qCats = (q.categoryIds || []).map(id => catMap[id] || 'Unbekannt').join(', ');
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerHTML = `
                    <div style="flex: 1;">
                        <p>${q.text}</p>
                        <small style="opacity: 0.6;">${qCats}</small>
                    </div>
                    <div class="actions">
                        <a href="edit-question.html?id=${q.id}" class="icon-btn" title="Bearbeiten">✏️</a>
                        <button class="icon-btn" onclick="deleteQuestion(${q.id})" title="Löschen">🗑️</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function deleteQuestion(id) {
            if (confirm('Diese Frage wirklich löschen?')) {
                await db.questions.delete(id);
                loadQuestions();
            }
        }

        window.onload = initCatalog;
    </script>
</body>
</html>
